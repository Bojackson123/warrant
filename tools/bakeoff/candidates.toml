# Embedding models compared over the control corpus.
#
# Each candidate keeps the query and document prefix its own model card specifies. The
# prefixes belong to the candidate rather than to the run: BGE is trained to expect an
# instruction on the query side only, Nomic expects a marker on both sides, MiniLM expects
# neither. Applying one convention globally would turn this from a comparison of models into
# a comparison of models against one arbitrary convention.
#
# `revision` freezes each candidate to a Hub commit. Model names on the Hub are mutable tags —
# the same name can return different weights a month later — so a result recording only the
# name is not reproducible. These commits were resolved by the harness on the first run and
# copied back in here; the run was then repeated against them and the metrics compared.

k_values = [1, 3, 5, 10]
batch_size = 32
query_latency_repeats = 20
device = "cpu"
seed = 0
normalize = true

[[models]]
# Ultra-light baseline, present to show what the heavier models actually buy.
name = "sentence-transformers/all-MiniLM-L6-v2"
revision = "1110a243fdf4706b3f48f1d95db1a4f5529b4d41"
label = "MiniLM-L6-v2"
query_prefix = ""
document_prefix = ""

[[models]]
# Same dimensionality as the baseline, stronger training.
name = "BAAI/bge-small-en-v1.5"
revision = "5c38ec7c405ec4b44b94cc5a9bb96e735b38267a"
label = "bge-small-en-v1.5"
query_prefix = "Represent this sentence for searching relevant passages: "
document_prefix = ""

[[models]]
name = "BAAI/bge-base-en-v1.5"
revision = "a5beb1e3e68b9ab74eb54cfd186867f64f240e1a"
label = "bge-base-en-v1.5"
query_prefix = "Represent this sentence for searching relevant passages: "
document_prefix = ""

[[models]]
# Long context. The only candidate that reads the longest controls without truncation.
# Ships its architecture as repository code, hence trust_remote_code.
name = "nomic-ai/nomic-embed-text-v1.5"
revision = "e9b6763023c676ca8431644204f50c2b100d9aab"
label = "nomic-embed-text-v1.5"
query_prefix = "search_query: "
document_prefix = "search_document: "
trust_remote_code = true
