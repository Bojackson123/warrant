[project]
name = "warrant"
version = "0.1.0"
description = "Retrieval question answering over the NIST SP 800-53 catalog, with citations that can be checked."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Upper-bounded on purpose. An unbounded floor is not a pin, and the fixture manifest's
# determinism claim is only as strong as CI, the container and a developer machine all
# resolving the same interpreter.
requires-python = ">=3.12,<3.13"
dependencies = [
    # Declared rather than inherited from torch. Vectors are numpy arrays across the seam between
    # the embedder, the pipeline and the query path, so this is a direct dependency of ours.
    "numpy>=2.0",
    # The generation provider's SDK, used by the live path only. Imported inside the live client
    # rather than at module scope, so a machine with no key never needs it -- which is the whole
    # point of the replay path and worth being structurally true rather than merely usually true.
    "openai>=2.0",
    "pgvector>=0.4.1",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic==2.12.4",
    "pydantic-settings==2.13.1",
    # Pinned exactly rather than floored. The stored vectors are a function of these two
    # versions as much as of the model pin: a change to either can move the last bits of an
    # embedding, and every recorded model call downstream is keyed on text retrieved by those
    # vectors. These are the versions the embedding comparison was measured under.
    "sentence-transformers==5.7.0",
    # Pinned exactly for a related but distinct reason: it decides no stored artefact, and it
    # decides every number this project reports about the size of a prompt. A floated version that
    # counted differently would leave nothing to re-record and every previously reported count
    # wrong, which is a failure with no artefact to notice it.
    "tiktoken==0.12.0",
    "torch==2.9.1",
]

[dependency-groups]
dev = [
    "pyright==1.1.407",
    "pytest==8.4.2",
    "ruff==0.14.5",
    "testcontainers[postgres]>=4.15.0",
]

# Torch from the CPU wheel index rather than from PyPI. On Linux the PyPI wheel bundles CUDA
# and is well over a gigabyte, for hardware nothing here uses -- the embedding model was
# chosen on CPU timings and runs on CPU in the container. `explicit = true` keeps every other
# package on PyPI; only the packages named below are looked for here.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/warrant"]

[tool.ruff]
line-length = 100
target-version = "py312"
# tools/ is committed evidence rather than shipped code, but it is still Python in this
# repository and it holds to the same bar.
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests", "tools"]
typeCheckingMode = "standard"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs a real Postgres, started as a container. Requires a running Docker.",
    "model: needs the pinned embedding weights in the local cache. `make model` fetches them.",
    "tokenizer: needs the pinned tokenizer encoding cached. `make tokenizer` fetches it.",
]
